<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>Wake Panel &mdash; Sign in</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100dvh;background:#0b0d10;color:#e6e9ef;
   font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:20px}
  form{max-width:320px;margin:22vh auto 0}
  h1{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#7d8797;
   font-weight:600;margin:0 0 18px;text-align:center}
  input{width:100%;padding:14px;font-size:16px;border-radius:11px;border:1px solid #232a35;
   background:#151920;color:#e6e9ef;margin-bottom:11px}
  button{width:100%;padding:14px;font-size:16px;font-weight:650;border-radius:11px;
   border:0;background:#2f6df6;color:#fff;cursor:pointer}
  .log{margin-top:16px;color:#8a6a3a;font-size:12px;min-height:1.4em;text-align:center}
</style>
</head>
<body>
<form method="POST" action="/login">
  <h1>Wake Panel</h1>
  <input type="password" name="password" placeholder="Password" autofocus autocomplete="current-password">
  <button type="submit">Sign in</button>
  <div class="log">{{MSG}}</div>
</form>
</body>
</html>
